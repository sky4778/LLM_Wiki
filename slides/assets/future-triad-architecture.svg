<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="triadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ECFDF5" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="24" fill="url(#triadBg)" stroke="#A7F3D0" stroke-width="2"/>

  <!-- Title -->
  <text x="480" y="55" font-family="'Noto Serif TC', serif" font-size="24" font-weight="700" fill="#065F46" text-anchor="middle">可靠智慧導師系統的「技術三角架構」</text>
  <text x="480" y="85" font-family="'Zen Kaku Gothic New', sans-serif" font-size="14" fill="#047857" text-anchor="middle">Reliable ITS = CoT (思維展開) + PRM (步驟診斷) + Toolformer (符號運算)</text>

  <!-- Central Interconnected Triangle Track -->
  <polygon points="480,140 240,410 720,410" fill="none" stroke="#6EE7B7" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- Top Node: CoT -->
  <g transform="translate(480, 140)">
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#FB7185" stroke-width="3" filter="url(#cardShadow)"/>
    <text x="0" y="-8" font-family="'Zen Kaku Gothic New', sans-serif" font-size="18" font-weight="800" fill="#E11D48" text-anchor="middle">CoT</text>
    <text x="0" y="14" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" font-weight="600" fill="#E11D48" text-anchor="middle">思維鏈提示</text>
    <rect x="-100" y="60" width="200" height="42" rx="10" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
    <text x="0" y="86" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" font-weight="600" fill="#9F1239" text-anchor="middle">中間推導步驟可視化</text>
  </g>

  <!-- Left Node: PRM -->
  <g transform="translate(240, 410)">
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" filter="url(#cardShadow)"/>
    <text x="0" y="-8" font-family="'Zen Kaku Gothic New', sans-serif" font-size="18" font-weight="800" fill="#0284C7" text-anchor="middle">PRM</text>
    <text x="0" y="14" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" font-weight="600" fill="#0284C7" text-anchor="middle">過程監督</text>
    <rect x="-100" y="60" width="200" height="42" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
    <text x="0" y="86" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" font-weight="600" fill="#075985" text-anchor="middle">每一步獨立驗證 • 杜絕歪打正著</text>
  </g>

  <!-- Right Node: Toolformer -->
  <g transform="translate(720, 410)">
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3" filter="url(#cardShadow)"/>
    <text x="0" y="-8" font-family="'Zen Kaku Gothic New', sans-serif" font-size="18" font-weight="800" fill="#4F46E5" text-anchor="middle">Tool-Use</text>
    <text x="0" y="14" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="middle">工具自主調用</text>
    <rect x="-100" y="60" width="200" height="42" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="0" y="86" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" font-weight="600" fill="#3730A3" text-anchor="middle">外掛計算器 • 根除純算術幻覺</text>
  </g>

  <!-- Central Nexus Core -->
  <g transform="translate(480, 320)">
    <circle cx="0" cy="0" r="38" fill="#10B981" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="'Zen Kaku Gothic New', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">智慧導師</text>
  </g>
</svg>
