<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="cliffArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Chart Header -->
  <text x="70" y="65" font-family="'Noto Serif TC', serif" font-size="24" font-weight="700" fill="#1E293B">二十步推理斷崖實證 (The 20-Step Cliff)</text>
  <text x="70" y="95" font-family="'Zen Kaku Gothic New', sans-serif" font-size="14" font-weight="400" fill="#64748B">數據來源：Xu et al. (2024) &amp; Paranjape et al. (2023) | 步數增加引發骨牌式連鎖錯誤</text>

  <!-- Grid Lines -->
  <g stroke="#F1F5F9" stroke-width="1.5">
    <!-- 100% -->
    <line x1="120" y1="140" x2="880" y2="140"/>
    <!-- 75% -->
    <line x1="120" y1="210" x2="880" y2="210"/>
    <!-- 50% -->
    <line x1="120" y1="280" x2="880" y2="280"/>
    <!-- 25% -->
    <line x1="120" y1="350" x2="880" y2="350"/>
    <!-- 0% -->
    <line x1="120" y1="420" x2="880" y2="420" stroke="#CBD5E1" stroke-width="2"/>
  </g>

  <!-- Y-Axis Labels -->
  <text x="100" y="145" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">100%</text>
  <text x="100" y="215" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">75%</text>
  <text x="100" y="285" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">50%</text>
  <text x="100" y="355" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">25%</text>
  <text x="100" y="425" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">0%</text>

  <!-- X-Axis Labels -->
  <text x="160" y="450" font-family="'Zen Kaku Gothic New', sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">1 步</text>
  <text x="320" y="450" font-family="'Zen Kaku Gothic New', sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">5 步 (短程)</text>
  <text x="520" y="450" font-family="'Zen Kaku Gothic New', sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">10 步 (轉折點)</text>
  <text x="700" y="450" font-family="'Zen Kaku Gothic New', sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">15 步</text>
  <text x="840" y="450" font-family="'Zen Kaku Gothic New', sans-serif" font-size="13" font-weight="600" fill="#E11D48" text-anchor="middle">20 步 (長程推論)</text>

  <!-- Shaded Area Under Curve -->
  <polygon points="160,154 320,156 520,210 700,290 840,320 840,420 160,420" fill="url(#cliffArea)"/>

  <!-- Plunging Curve -->
  <path d="M 160 154 C 240 155, 320 156, 400 170 C 480 185, 520 210, 600 250 C 680 290, 760 310, 840 320" fill="none" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Point 1: 95% at 5 steps -->
  <g transform="translate(320, 156)">
    <circle cx="0" cy="0" r="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="4"/>
    <rect x="-45" y="-50" width="90" height="36" rx="10" fill="#0284C7"/>
    <text x="0" y="-27" font-family="'Zen Kaku Gothic New', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">95%</text>
    <text x="0" y="30" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" font-weight="600" fill="#0284C7" text-anchor="middle">常態高準度</text>
  </g>

  <!-- Point 2: 36% at 20 steps -->
  <g transform="translate(840, 320)">
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" stroke="#E11D48" stroke-width="5"/>
    <rect x="-55" y="-54" width="110" height="40" rx="10" fill="#E11D48"/>
    <text x="0" y="-29" font-family="'Zen Kaku Gothic New', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">36% 斷崖</text>
    <text x="0" y="32" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" font-weight="600" fill="#E11D48" text-anchor="middle">嚴重失真崩潰</text>
  </g>

  <!-- Bottom Insight Badge -->
  <rect x="180" y="480" width="600" height="34" rx="17" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
  <text x="480" y="502" font-family="'Zen Kaku Gothic New', sans-serif" font-size="13" font-weight="600" fill="#BE123C" text-anchor="middle">💡 破局關鍵：必須引入過程監督 (PRM) 進行單步核驗與外部工具調用 (Tool-Use)</text>
</svg>
