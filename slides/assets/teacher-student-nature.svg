<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title -->
  <text x="480" y="55" font-family="'Noto Serif TC', serif" font-size="24" font-weight="700" fill="#1E293B" text-anchor="middle">教育本質的不可通約性：身教 vs 演算</text>
  <text x="480" y="85" font-family="'Zen Kaku Gothic New', sans-serif" font-size="14" fill="#64748B" text-anchor="middle">人類培育之「隱性知識」與機器「自監督統計運算」的邊界</text>

  <!-- Left: Human Pedagogy (Sakura / Warm) -->
  <g transform="translate(60, 120)">
    <rect width="400" height="360" rx="20" fill="#FFF1F2" stroke="#FECDD3" stroke-width="2" filter="url(#pShadow)"/>
    <text x="200" y="45" font-family="'Zen Kaku Gothic New', sans-serif" font-size="18" font-weight="700" fill="#BE123C" text-anchor="middle">🌱 人類教育歷程 (以人育人)</text>

    <!-- Sequence -->
    <rect x="30" y="75" width="340" height="60" rx="12" fill="#FFFFFF" stroke="#FFE4E6" stroke-width="1.5"/>
    <text x="50" y="102" font-family="'Zen Kaku Gothic New', sans-serif" font-size="14" font-weight="700" fill="#9F1239">1. 價值觀塑造 (Moral Orientation)</text>
    <text x="50" y="122" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#64748B">由眼神肯定、品德典範建立良知心智</text>

    <rect x="30" y="150" width="340" height="60" rx="12" fill="#FFFFFF" stroke="#FFE4E6" stroke-width="1.5"/>
    <text x="50" y="177" font-family="'Zen Kaku Gothic New', sans-serif" font-size="14" font-weight="700" fill="#9F1239">2. 系統化知識汲取</text>
    <text x="50" y="197" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#64748B">結合情境經驗，融會貫通跨學科結構</text>

    <rect x="30" y="225" width="340" height="60" rx="12" fill="#FFFFFF" stroke="#FFE4E6" stroke-width="1.5"/>
    <text x="50" y="252" font-family="'Zen Kaku Gothic New', sans-serif" font-size="14" font-weight="700" fill="#9F1239">3. 生活實踐與挫敗撫慰</text>
    <text x="50" y="272" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#64748B">同理心、抗壓韌性、真實人際連結</text>

    <text x="200" y="325" font-family="'Zen Kaku Gothic New', sans-serif" font-size="13" font-weight="600" fill="#BE123C" text-anchor="middle">核心：難以被向量化的「隱性身教」</text>
  </g>

  <!-- Right: Machine Learning (Ruri Blue / Cool) -->
  <g transform="translate(500, 120)">
    <rect width="400" height="360" rx="20" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2" filter="url(#pShadow)"/>
    <text x="200" y="45" font-family="'Zen Kaku Gothic New', sans-serif" font-size="18" font-weight="700" fill="#0369A1" text-anchor="middle">🤖 機器學習機制 (語料演算)</text>

    <!-- Sequence -->
    <rect x="30" y="75" width="340" height="60" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
    <text x="50" y="102" font-family="'Zen Kaku Gothic New', sans-serif" font-size="14" font-weight="700" fill="#075985">1. 巨量語料吞吐 (Pre-training)</text>
    <text x="50" y="122" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#64748B">統計關聯預測，無真實世界肉身經驗</text>

    <rect x="30" y="150" width="340" height="60" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
    <text x="50" y="177" font-family="'Zen Kaku Gothic New', sans-serif" font-size="14" font-weight="700" fill="#075985">2. 人類偏好微調 (RLHF / SFT)</text>
    <text x="50" y="197" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#64748B">模擬人類回答風格，缺乏內生自省能力</text>

    <rect x="30" y="225" width="340" height="60" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
    <text x="50" y="252" font-family="'Zen Kaku Gothic New', sans-serif" font-size="14" font-weight="700" fill="#075985">3. 24/7 高速即時反饋</text>
    <text x="50" y="272" font-family="'Zen Kaku Gothic New', sans-serif" font-size="12" fill="#64748B">極度高吞吐，但毫無痛感與生命共鳴</text>

    <text x="200" y="325" font-family="'Zen Kaku Gothic New', sans-serif" font-size="13" font-weight="600" fill="#0369A1" text-anchor="middle">核心：高效率之「符號組合計算工具」</text>
  </g>
</svg>
