<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F5" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FAFAFB" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F0F9FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="24" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Zen Concentric Rings -->
  <circle cx="480" cy="270" r="210" fill="none" stroke="#FDA4AF" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="480" cy="270" r="160" fill="none" stroke="#7DD3FC" stroke-width="2" opacity="0.5"/>
  <circle cx="480" cy="270" r="110" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Connecting Node Beam -->
  <line x1="260" y1="270" x2="700" y2="270" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Left Node: Human Thought (Sakura) -->
  <g transform="translate(320, 270)">
    <circle cx="0" cy="0" r="60" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="46" fill="url(#roseGrad)"/>
    <text x="0" y="8" font-family="'Zen Kaku Gothic New', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">人類培育</text>
    <text x="0" y="90" font-family="'Zen Kaku Gothic New', sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">價值觀 • 情感共鳴 • 身教</text>
  </g>

  <!-- Right Node: AI Neural Synthesis (Ruri Blue) -->
  <g transform="translate(640, 270)">
    <circle cx="0" cy="0" r="60" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="46" fill="url(#skyGrad)"/>
    <text x="0" y="8" font-family="'Zen Kaku Gothic New', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">機器智能</text>
    <text x="0" y="90" font-family="'Zen Kaku Gothic New', sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">巨量運算 • 24/7 答疑 • 即時生成</text>
  </g>

  <!-- Central Fusion Nexus -->
  <g transform="translate(480, 270)">
    <rect x="-65" y="-30" width="130" height="60" rx="30" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#softGlow)"/>
    <text x="0" y="6" font-family="'Zen Kaku Gothic New', sans-serif" font-size="15" font-weight="700" fill="#059669" text-anchor="middle">人本協同</text>
  </g>

  <!-- Top Title Badge -->
  <rect x="360" y="45" width="240" height="38" rx="19" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="480" y="69" font-family="'Zen Kaku Gothic New', sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">🌸 LLMEdu 核心意象</text>
</svg>
